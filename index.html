<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rumo ao Trono</title>
    <meta name="description" content="Viva a carreira de um enxadrista em Riga, 1950. Capítulo 1: o parque do bairro." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;800&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #14110d; }
      #jogo { width: 100%; height: 100%; }
      /* A pergunta do apelido, por cima do jogo, na primeira vez. */
      #apelido {
        position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: rgba(20, 17, 13, 0.82); font-family: Lora, Georgia, serif;
      }
      #apelido[hidden] { display: none; }
      #apelido .folha {
        width: min(520px, 100%); background: #efe4cc; color: #2b2118; border: 2px solid #c9a35a;
        padding: 28px 28px 22px; box-shadow: 8px 10px 0 rgba(0, 0, 0, 0.35);
      }
      #apelido h2 { margin: 0 0 8px; font-family: 'Playfair Display', Georgia, serif; font-size: 28px; }
      #apelido p { margin: 0 0 16px; font-size: 16px; line-height: 1.45; color: #4a3a2a; }
      #apelido input {
        width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; font-size: 20px;
        border: 2px solid #8a6a43; background: #fffaf0; color: #2b2118;
      }
      #apelido .botoes { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
      #apelido button { font: inherit; font-weight: 600; font-size: 17px; padding: 10px 18px; cursor: pointer; border: 2px solid #c9a35a; }
      #apelido [data-entrar] { background: #4d5a3a; color: #efe4cc; }
      #apelido [data-entrar]:disabled { opacity: 0.6; cursor: wait; }
      #apelido [data-pular] { background: transparent; color: #8a6a43; border-color: transparent; text-decoration: underline; }
      #apelido [data-erro] { min-height: 20px; margin: 10px 0 0; color: #8e3b2e; font-size: 15px; }
      /* O jogo é deitado (1280×720): no celular em pé, pede para girar. */
      #gire { display: none; }
      @media (orientation: portrait) and (max-width: 820px) {
        #gire {
          display: flex; position: fixed; inset: 0; z-index: 10;
          flex-direction: column; align-items: center; justify-content: center; gap: 12px;
          padding: 24px; text-align: center; background: #14110d; color: #efe4cc;
          font-family: Lora, Georgia, serif; font-size: 20px; line-height: 1.4;
        }
        #gire .icone { font-size: 56px; color: #c9a35a; }
        #gire small { color: #8a6a43; font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="gire" role="status">
      <div class="icone" aria-hidden="true">⟳ ♞</div>
      <div>Gire o celular para jogar.</div>
      <small>Rotate your phone to play.</small>
    </div>
    <div id="apelido" hidden role="dialog" aria-modal="true" aria-labelledby="apelido-titulo">
      <div class="folha">
        <h2 id="apelido-titulo" data-titulo></h2>
        <p data-explicacao></p>
        <input type="text" maxlength="30" autocomplete="nickname" aria-labelledby="apelido-titulo" />
        <p data-erro role="alert"></p>
        <div class="botoes">
          <button type="button" data-entrar></button>
          <button type="button" data-pular></button>
        </div>
      </div>
    </div>
    <div id="jogo"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
