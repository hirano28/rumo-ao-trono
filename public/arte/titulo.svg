<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Riga à noite, vista do outro lado do Daugava. Arte do jogo (GPL-3.0). -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090c18"/>
      <stop offset="0.6" stop-color="#16203a"/>
      <stop offset="1" stop-color="#3a3a4a"/>
    </linearGradient>
    <linearGradient id="rio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2236"/>
      <stop offset="1" stop-color="#0a0d18"/>
    </linearGradient>
    <radialGradient id="lua" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6eed6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f6eed6" stop-opacity="0"/>
    </radialGradient>
    <filter id="tremido"><feTurbulence type="fractalNoise" baseFrequency="0.01 0.3" numOctaves="2" seed="4" result="r"/><feDisplacementMap in="SourceGraphic" in2="r" scale="10"/></filter>
    <filter id="borrao"><feGaussianBlur stdDeviation="2"/></filter>
    <g id="cidade">
      <!-- telhados, e as torres: São Tiago (fina), o Domo (bulbo) e São Pedro (escalonada) -->
      <rect x="0" y="560" width="1280" height="40"/>
      <path d="M40 560 L60 540 L80 560 Z M200 560 L220 532 L240 560 Z M540 560 L560 530 L580 560 Z M760 560 L780 534 L800 560 Z M960 560 L990 530 L1020 560 Z M1180 560 L1200 540 L1220 560 Z"/>
      <rect x="120" y="548" width="30" height="12"/><rect x="300" y="540" width="40" height="20"/><rect x="860" y="540" width="40" height="20"/><rect x="1080" y="546" width="40" height="14"/>
      <path d="M380 560 L380 470 L386 470 L392 420 L398 470 L404 470 L404 560 Z"/>
      <path d="M470 560 L470 520 C470 500 500 500 500 520 L500 560 Z"/>
      <path d="M476 506 C476 474 494 474 494 506 Z"/><rect x="483" y="462" width="4" height="14"/>
      <path d="M640 560 L640 430 L652 430 L652 404 L660 404 L660 372 L666 372 L666 344 L670 314 L674 344 L674 372 L680 372 L680 404 L688 404 L688 430 L700 430 L700 560 Z"/>
    </g>
  </defs>
  <rect width="1280" height="600" fill="url(#ceu)"/>
  <g fill="#f3ead2">
    <circle cx="120" cy="60" r="1.2"/><circle cx="260" cy="140" r="1"/><circle cx="380" cy="40" r="1.3"/><circle cx="520" cy="110" r="0.9"/>
    <circle cx="760" cy="60" r="1.1"/><circle cx="880" cy="150" r="0.9"/><circle cx="980" cy="40" r="1.2"/><circle cx="1180" cy="120" r="1"/>
    <circle cx="60" cy="200" r="0.8"/><circle cx="1240" cy="220" r="0.8"/><circle cx="700" cy="200" r="0.7"/><circle cx="330" cy="230" r="0.7"/>
  </g>
  <circle cx="1080" cy="150" r="70" fill="url(#lua)"/>
  <circle cx="1080" cy="150" r="26" fill="#f3ead2"/>
  <circle cx="1093" cy="142" r="23" fill="#16203a"/>
  <!-- a cidade e as janelas acesas -->
  <use href="#cidade" fill="#05070d"/>
  <g fill="#ffd27a" opacity="0.9">
    <rect x="60" y="566" width="5" height="7"/><rect x="160" y="566" width="5" height="7"/><rect x="250" y="570" width="5" height="7"/>
    <rect x="320" y="566" width="5" height="7"/><rect x="420" y="570" width="5" height="7"/><rect x="560" y="566" width="5" height="7"/>
    <rect x="720" y="570" width="5" height="7"/><rect x="820" y="566" width="5" height="7"/><rect x="920" y="570" width="5" height="7"/>
    <rect x="1040" y="566" width="5" height="7"/><rect x="1150" y="570" width="5" height="7"/><rect x="1240" y="566" width="5" height="7"/>
    <rect x="667" y="450" width="4" height="8"/><rect x="389" y="500" width="3" height="6"/>
  </g>
  <!-- o rio Daugava, com o reflexo tremido -->
  <rect y="600" width="1280" height="120" fill="url(#rio)"/>
  <g filter="url(#tremido)" opacity="0.5">
    <use href="#cidade" fill="#05070d" transform="translate(0 1200) scale(1 -1)"/>
    <g fill="#ffd27a" opacity="0.7"><rect x="60" y="624" width="5" height="12"/><rect x="320" y="626" width="5" height="12"/><rect x="560" y="624" width="5" height="12"/><rect x="820" y="626" width="5" height="12"/><rect x="1040" y="624" width="5" height="12"/></g>
    <rect x="1066" y="620" width="28" height="90" fill="#f3ead2" opacity="0.35"/>
  </g>
  <line x1="0" y1="600" x2="1280" y2="600" stroke="#2a3048" stroke-width="2"/>
</svg>
