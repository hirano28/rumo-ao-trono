<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- O parque do bairro, Riga, fim de tarde de outono de 1950. Arte do jogo (GPL-3.0). -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa1b5"/>
      <stop offset="0.55" stop-color="#c9c0a8"/>
      <stop offset="1" stop-color="#e3c79a"/>
    </linearGradient>
    <linearGradient id="grama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7a48"/>
      <stop offset="1" stop-color="#4e5833"/>
    </linearGradient>
    <linearGradient id="caminho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ad85"/>
      <stop offset="1" stop-color="#a88f68"/>
    </linearGradient>
    <linearGradient id="pedra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a39d92"/>
      <stop offset="1" stop-color="#7d776d"/>
    </linearGradient>
    <radialGradient id="sol" cx="1050" cy="250" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd890" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd890" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="borrao"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="nevoa"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.08 0"/>
    </filter>
    <g id="copaOutono">
      <circle cx="0" cy="0" r="58" fill="#9c5a24"/>
      <circle cx="-44" cy="20" r="46" fill="#b8742c"/>
      <circle cx="46" cy="16" r="48" fill="#a8632a"/>
      <circle cx="-14" cy="-40" r="44" fill="#c98a38"/>
      <circle cx="30" cy="-34" r="40" fill="#b5702e"/>
      <circle cx="-30" cy="-10" r="20" fill="#d9a04a" opacity="0.8"/>
      <circle cx="20" cy="-50" r="16" fill="#e0ad55" opacity="0.7"/>
      <circle cx="56" cy="30" r="22" fill="#8a4e20"/>
    </g>
  </defs>

  <!-- céu de fim de tarde -->
  <rect width="1280" height="420" fill="url(#ceu)"/>
  <g fill="#f1e6cf" opacity="0.55" filter="url(#nevoa)">
    <ellipse cx="240" cy="70" rx="120" ry="16"/><ellipse cx="330" cy="86" rx="80" ry="12"/>
    <ellipse cx="900" cy="56" rx="140" ry="14"/><ellipse cx="1020" cy="72" rx="90" ry="10"/>
  </g>

  <!-- fachadas Art Nouveau ao fundo -->
  <g stroke="#5a5047" stroke-width="1.2">
    <!-- prédio 1 -->
    <path d="M0 160 L120 160 L120 140 L150 112 L180 140 L180 160 L200 160 L200 400 L0 400 Z" fill="#c9b48e"/>
    <!-- prédio 2, com torreão -->
    <path d="M200 190 L330 190 L330 400 L200 400 Z" fill="#a9b3b0"/>
    <path d="M300 190 L300 118 C300 92 330 92 330 118 L330 190 Z" fill="#98a29f"/>
    <path d="M296 120 C296 80 334 80 334 120 Z" fill="#6f7d74"/>
    <path d="M315 74 v10" stroke-width="2"/>
    <!-- prédio 3, frontão curvo -->
    <path d="M330 200 C330 164 360 140 400 136 C440 140 470 164 470 200 Z" fill="#d8b7a2"/>
    <rect x="330" y="200" width="140" height="200" fill="#d8b7a2"/>
    <!-- prédio 4 (atrás da torre de igreja) -->
    <path d="M560 170 L700 170 L700 400 L560 400 Z" fill="#c4bfae"/>
    <!-- torre de igreja distante -->
    <path d="M612 170 L612 70 L622 70 L630 20 L638 70 L648 70 L648 170 Z" fill="#8c867b"/>
    <!-- prédio 5, frontão escalonado -->
    <path d="M700 180 L730 180 L730 160 L760 160 L760 140 L800 140 L800 160 L830 160 L830 180 L860 180 L860 400 L700 400 Z" fill="#b7a684"/>
    <!-- prédio 6 -->
    <path d="M860 150 L1040 150 L1040 400 L860 400 Z" fill="#cdbfa2"/>
    <path d="M860 150 L950 104 L1040 150 Z" fill="#8a6a50"/>
    <!-- prédio 7 -->
    <path d="M1040 176 L1280 176 L1280 400 L1040 400 Z" fill="#a8b0aa"/>
  </g>
  <!-- janelas e ornamentos -->
  <g fill="#5d6e7a" opacity="0.85">
    <rect x="20" y="190" width="22" height="34"/><rect x="66" y="190" width="22" height="34"/><rect x="112" y="190" width="22" height="34"/><rect x="158" y="190" width="22" height="34"/>
    <rect x="20" y="250" width="22" height="34"/><rect x="66" y="250" width="22" height="34"/><rect x="112" y="250" width="22" height="34"/><rect x="158" y="250" width="22" height="34"/>
    <rect x="222" y="214" width="20" height="30"/><rect x="262" y="214" width="20" height="30"/><rect x="222" y="270" width="20" height="30"/><rect x="262" y="270" width="20" height="30"/>
    <rect x="352" y="214" width="22" height="34" rx="11"/><rect x="390" y="214" width="22" height="34" rx="11"/><rect x="428" y="214" width="22" height="34" rx="11"/>
    <rect x="352" y="272" width="22" height="34"/><rect x="390" y="272" width="22" height="34"/><rect x="428" y="272" width="22" height="34"/>
    <rect x="580" y="200" width="20" height="30"/><rect x="660" y="200" width="20" height="30"/><rect x="580" y="256" width="20" height="30"/><rect x="660" y="256" width="20" height="30"/>
    <rect x="716" y="200" width="20" height="32"/><rect x="756" y="200" width="20" height="32"/><rect x="796" y="200" width="20" height="32"/><rect x="826" y="200" width="20" height="32"/>
    <rect x="716" y="258" width="20" height="32"/><rect x="756" y="258" width="20" height="32"/><rect x="796" y="258" width="20" height="32"/>
    <rect x="880" y="176" width="24" height="36"/><rect x="928" y="176" width="24" height="36"/><rect x="976" y="176" width="24" height="36"/>
    <rect x="880" y="236" width="24" height="36"/><rect x="928" y="236" width="24" height="36"/><rect x="976" y="236" width="24" height="36"/>
    <rect x="1060" y="200" width="22" height="34"/><rect x="1106" y="200" width="22" height="34"/><rect x="1152" y="200" width="22" height="34"/><rect x="1198" y="200" width="22" height="34"/><rect x="1244" y="200" width="22" height="34"/>
    <rect x="1060" y="260" width="22" height="34"/><rect x="1106" y="260" width="22" height="34"/><rect x="1152" y="260" width="22" height="34"/>
  </g>
  <g fill="#f3e2b8" opacity="0.8">
    <rect x="66" y="250" width="22" height="34"/><rect x="390" y="214" width="22" height="34" rx="11"/>
    <rect x="976" y="236" width="24" height="36"/><rect x="1152" y="260" width="22" height="34"/>
  </g>
  <g fill="none" stroke="#7a6a58" stroke-width="2" opacity="0.7">
    <path d="M340 204 q60 -40 120 0"/><circle cx="400" cy="170" r="10"/>
    <path d="M200 206 h130 M560 186 h140 M860 168 h180 M1040 190 h240"/>
    <path d="M730 168 q50 -26 100 0"/>
  </g>

  <!-- rua com o bonde -->
  <rect y="372" width="1280" height="34" fill="#6a645b"/>
  <g stroke="#3c3833" stroke-width="2"><line x1="0" y1="392" x2="1280" y2="392"/><line x1="0" y1="398" x2="1280" y2="398"/></g>
  <line x1="0" y1="330" x2="1280" y2="330" stroke="#3c3833" stroke-width="1.2"/>
  <g>
    <rect x="610" y="336" width="210" height="52" rx="8" fill="#a8352b" stroke="#3a1612" stroke-width="2"/>
    <rect x="610" y="366" width="210" height="10" fill="#e7d9b6"/>
    <g fill="#c9d6dc" stroke="#3a1612" stroke-width="1.2">
      <rect x="622" y="342" width="26" height="20"/><rect x="654" y="342" width="26" height="20"/><rect x="686" y="342" width="26" height="20"/>
      <rect x="718" y="342" width="26" height="20"/><rect x="750" y="342" width="26" height="20"/><rect x="782" y="342" width="26" height="20"/>
    </g>
    <path d="M700 336 L690 330 M720 336 L730 330" stroke="#3a1612" stroke-width="2"/>
    <circle cx="640" cy="390" r="6" fill="#2b2118"/><circle cx="790" cy="390" r="6" fill="#2b2118"/>
  </g>

  <!-- gradil do parque -->
  <rect y="404" width="1280" height="8" fill="#3c3833"/>
  <g stroke="#3c3833" stroke-width="3">
    <line x1="10" y1="384" x2="10" y2="408"/><line x1="40" y1="384" x2="40" y2="408"/><line x1="70" y1="384" x2="70" y2="408"/><line x1="100" y1="384" x2="100" y2="408"/>
    <line x1="1160" y1="384" x2="1160" y2="408"/><line x1="1190" y1="384" x2="1190" y2="408"/><line x1="1220" y1="384" x2="1220" y2="408"/><line x1="1250" y1="384" x2="1250" y2="408"/>
  </g>

  <!-- gramado e caminho -->
  <rect y="410" width="1280" height="310" fill="url(#grama)"/>
  <path d="M0 560 C300 536 520 548 700 556 C900 566 1100 552 1280 540 L1280 640 C1080 652 880 662 640 654 C400 646 200 642 0 650 Z" fill="url(#caminho)"/>
  <g fill="#9a8460" opacity="0.6">
    <circle cx="120" cy="600" r="2"/><circle cx="260" cy="590" r="1.6"/><circle cx="430" cy="612" r="2"/><circle cx="610" cy="600" r="1.8"/>
    <circle cx="780" cy="620" r="2"/><circle cx="960" cy="604" r="1.6"/><circle cx="1120" cy="596" r="2"/><circle cx="1220" cy="610" r="1.6"/>
  </g>
  <!-- folhas caídas -->
  <g opacity="0.9">
    <g fill="#b8742c"><ellipse cx="90" cy="680" rx="7" ry="3" transform="rotate(20 90 680)"/><ellipse cx="300" cy="700" rx="6" ry="3"/><ellipse cx="540" cy="690" rx="7" ry="3" transform="rotate(-30 540 690)"/><ellipse cx="880" cy="700" rx="6" ry="3"/><ellipse cx="1180" cy="690" rx="7" ry="3" transform="rotate(40 1180 690)"/></g>
    <g fill="#c98a38"><ellipse cx="200" cy="620" rx="6" ry="3" transform="rotate(10 200 620)"/><ellipse cx="660" cy="630" rx="6" ry="3"/><ellipse cx="1000" cy="640" rx="6" ry="3" transform="rotate(-20 1000 640)"/><ellipse cx="400" cy="520" rx="5" ry="2.5"/><ellipse cx="760" cy="470" rx="5" ry="2.5"/></g>
    <g fill="#8a4e20"><ellipse cx="150" cy="560" rx="6" ry="3"/><ellipse cx="480" cy="660" rx="6" ry="3" transform="rotate(30 480 660)"/><ellipse cx="1100" cy="520" rx="5" ry="2.5"/><ellipse cx="840" cy="680" rx="6" ry="3"/></g>
  </g>

  <!-- árvores de outono -->
  <g>
    <path d="M70 560 C74 470 60 380 82 300 L108 300 C96 380 104 470 112 560 Z" fill="#3a2a1a"/>
    <use href="#copaOutono" x="96" y="230"/>
    <use href="#copaOutono" x="20" y="300" transform="scale(1)"/>
  </g>
  <g>
    <path d="M1196 540 C1200 450 1188 360 1206 290 L1230 290 C1222 360 1228 450 1236 540 Z" fill="#3a2a1a"/>
    <use href="#copaOutono" x="1218" y="220"/>
  </g>
  <g opacity="0.95">
    <path d="M540 450 C542 400 534 360 546 320 L560 320 C554 360 558 400 562 450 Z" fill="#3a2a1a"/>
    <use href="#copaOutono" transform="translate(552 290) scale(0.55)"/>
  </g>

  <!-- poste de luz a gás, ao lado do banco -->
  <g transform="translate(-712 0)">
    <rect x="1006" y="380" width="8" height="200" fill="#2b2a28"/>
    <rect x="998" y="572" width="24" height="10" fill="#2b2a28"/>
    <path d="M996 380 L1024 380 L1030 350 L990 350 Z" fill="#2b2a28"/>
    <path d="M994 348 L1026 348 L1018 334 L1002 334 Z" fill="#2b2a28"/>
    <rect x="996" y="352" width="28" height="26" fill="#f0d79a" opacity="0.55"/>
  </g>

  <!-- banco de praça -->
  <g>
    <rect x="128" y="508" width="130" height="10" rx="3" fill="#7a5434" stroke="#3a2516" stroke-width="1.5"/>
    <rect x="128" y="488" width="130" height="8" rx="3" fill="#7a5434" stroke="#3a2516" stroke-width="1.5"/>
    <rect x="128" y="474" width="130" height="8" rx="3" fill="#7a5434" stroke="#3a2516" stroke-width="1.5"/>
    <path d="M138 474 v66 M248 474 v66" stroke="#2b2a28" stroke-width="5"/>
  </g>

  <!-- mesas de pedra com tabuleiro (e banquinhos) -->
  <g id="mesa1">
    <ellipse cx="470" cy="572" rx="70" ry="10" fill="#000" opacity="0.2" filter="url(#borrao)"/>
    <rect x="456" y="508" width="28" height="62" fill="url(#pedra)" stroke="#57524a" stroke-width="1.5"/>
    <ellipse cx="470" cy="508" rx="62" ry="18" fill="#b4ada1" stroke="#57524a" stroke-width="1.5"/>
    <path d="M436 506 L470 494 L504 506 L470 518 Z" fill="#e8d3a8" stroke="#57524a" stroke-width="1"/>
    <g fill="#a87a4f"><path d="M453 500 L462 497 L470 500 L461 503 Z"/><path d="M470 500 L479 497 L487 500 L478 503 Z"/><path d="M444 506 L453 503 L461 506 L452 509 Z"/><path d="M461 506 L470 503 L478 506 L469 509 Z"/><path d="M478 506 L487 503 L495 506 L486 509 Z"/><path d="M453 512 L461 509 L469 512 L461 515 Z"/><path d="M469 512 L478 509 L486 512 L478 515 Z"/></g>
    <g fill="#2b2118"><rect x="458" y="488" width="4" height="10"/><rect x="474" y="490" width="4" height="8"/></g>
    <g fill="#f4ecd8" stroke="#2b2118" stroke-width="0.8"><rect x="464" y="496" width="4" height="10"/><rect x="482" y="500" width="4" height="8"/></g>
    <ellipse cx="402" cy="550" rx="16" ry="6" fill="#9a9488" stroke="#57524a"/><rect x="394" y="550" width="16" height="22" fill="#8a8478"/>
    <ellipse cx="538" cy="550" rx="16" ry="6" fill="#9a9488" stroke="#57524a"/><rect x="530" y="550" width="16" height="22" fill="#8a8478"/>
  </g>
  <use href="#mesa1" x="340" y="0"/>

  <!-- banca de jornais -->
  <g>
    <rect x="1078" y="402" width="164" height="150" fill="#4d5a3a" stroke="#2c331f" stroke-width="2"/>
    <path d="M1064 404 L1160 368 L1256 404 Z" fill="#6f7d55" stroke="#2c331f" stroke-width="2"/>
    <rect x="1086" y="410" width="148" height="18" fill="#efe4cc"/>
    <text x="1160" y="423" font-family="Georgia, serif" font-size="10" fill="#2b2118" text-anchor="middle" letter-spacing="1.5">ГАЗЕТЫ · ЖУРНАЛЫ</text>
    <rect x="1092" y="436" width="136" height="70" fill="#2c331f"/>
    <g>
      <rect x="1098" y="442" width="30" height="40" fill="#e7dcc0"/><rect x="1098" y="442" width="30" height="8" fill="#8e3b2e"/>
      <rect x="1134" y="442" width="30" height="40" fill="#efe4cc"/><path d="M1138 454 h22 M1138 460 h22 M1138 466 h18" stroke="#2b2118" stroke-width="1.5" opacity="0.6"/>
      <rect x="1170" y="442" width="30" height="40" fill="#d9c9a6"/><rect x="1176" y="448" width="18" height="14" fill="#6b5f50" opacity="0.6"/>
      <rect x="1204" y="446" width="20" height="36" fill="#c9a35a"/>
    </g>
    <rect x="1086" y="506" width="148" height="10" fill="#6f7d55"/>
  </g>

  <!-- luz quente do sol baixo e vinheta -->
  <rect width="1280" height="720" fill="url(#sol)"/>
  <rect width="1280" height="720" fill="url(#vinheta)"/>
  <rect width="1280" height="720" filter="url(#grao)" opacity="0.9"/>
</svg>
