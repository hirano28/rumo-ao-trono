  <rect y="504" width="1280" height="6" fill="#4a3320"/>
  <rect y="58" width="1280" height="5" fill="#2d241a" opacity="0.6"/>

  <!-- assoalho em perspectiva -->
  <rect y="545" width="1280" height="175" fill="url(#tacos)"/>
  <g stroke="#2e1e10" stroke-width="2" opacity="0.55">
    <line x1="0" y1="575" x2="1280" y2="575"/>
    <line x1="0" y1="612" x2="1280" y2="612"/>
    <line x1="0" y1="656" x2="1280" y2="656"/>
    <line x1="0" y1="706" x2="1280" y2="706"/>
    <line x1="140" y1="545" x2="20" y2="575"/><line x1="420" y1="575" x2="380" y2="612"/>
    <line x1="760" y1="545" x2="770" y2="575"/><line x1="1060" y1="575" x2="1100" y2="612"/>
    <line x1="250" y1="612" x2="200" y2="656"/><line x1="620" y1="612" x2="610" y2="656"/>
    <line x1="980" y1="656" x2="1010" y2="706"/><line x1="90" y1="656" x2="40" y2="706"/>
    <line x1="470" y1="656" x2="455" y2="706"/><line x1="1220" y1="612" x2="1260" y2="656"/>
  </g>

  <!-- tapete sob a escrivaninha -->
  <ellipse cx="850" cy="640" rx="390" ry="62" fill="url(#tapete)"/>
  <ellipse cx="850" cy="640" rx="360" ry="50" fill="none" stroke="#c9a35a" stroke-width="3" opacity="0.55"/>
  <ellipse cx="850" cy="640" rx="320" ry="40" fill="none" stroke="#2b120f" stroke-width="6" stroke-dasharray="14 10" opacity="0.45"/>

  <!-- porta almofadada -->
  <g>
    <rect x="30" y="268" width="160" height="276" fill="#2b1d12"/>
    <rect x="38" y="276" width="144" height="268" fill="#5a3b26"/>
    <rect x="52" y="294" width="116" height="104" fill="#4c311f" stroke="#3a2516" stroke-width="3"/>
