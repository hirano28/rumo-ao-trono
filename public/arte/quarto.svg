      <rect x="964" y="214" width="18" height="3"/><rect x="964" y="258" width="18" height="2"/>
      <rect x="1014" y="230" width="14" height="3"/><rect x="1058" y="228" width="16" height="3"/>
    </g>
  </g>

  <!-- brilho quente da luminária na parede -->
  <rect width="1280" height="720" fill="url(#luzDaLuminaria)"/>

  <!-- escrivaninha -->
  <g>
