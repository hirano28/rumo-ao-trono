      <path d="M686 456 L698 456 L696 450 L694 444 C697 440 694 434 690 434 C686 434 683 440 686 444 L684 450 Z" fill="#2b2118"/>
    </g>
  </g>

  <!-- jornal dobrado -->
  <g>
    <path d="M688 440 L834 438 L840 464 L682 466 Z" fill="#efe4cc"/>
    <path d="M688 440 L834 438 L836 446 L686 448 Z" fill="#d9c9a6"/>
    <rect x="696" y="449" width="64" height="5" fill="#2b2118" opacity="0.8"/>
