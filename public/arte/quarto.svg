    <ellipse cx="1030" cy="462" rx="15" ry="4" fill="#c9b893"/>
    <path d="M1018 446 L1042 446 L1038 462 L1022 462 Z" fill="#f4ecd8" stroke="#b8a77f" stroke-width="1"/>
    <path d="M1042 450 C1050 450 1050 458 1040 458" stroke="#f4ecd8" stroke-width="3" fill="none"/>
