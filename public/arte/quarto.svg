    <rect x="214" y="478" width="96" height="50" fill="#6e4b2c" stroke="#3a2516" stroke-width="2"/>
    <rect x="252" y="440" width="20" height="5" rx="2" fill="#c9a35a"/>
    <rect x="252" y="498" width="20" height="5" rx="2" fill="#c9a35a"/>
    <rect x="200" y="400" width="124" height="8" fill="#7f5838"/>
