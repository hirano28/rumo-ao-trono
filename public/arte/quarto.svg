      <circle cx="530" cy="100" r="0.8"/><circle cx="352" cy="138" r="0.7"/>
    </g>
    <!-- silhuetas: telhados, a torre de São Pedro (escalonada) e a do Domo -->
    <g fill="#0c111c">
