    <line x1="760" y1="112" x2="730" y2="140" stroke="#2b1d12" stroke-width="1.5"/>
    <line x1="760" y1="112" x2="790" y2="140" stroke="#2b1d12" stroke-width="1.5"/>
    <circle cx="760" cy="112" r="3" fill="#c9a35a"/>
