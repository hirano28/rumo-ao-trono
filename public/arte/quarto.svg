<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- O quarto do menino, Riga, outono de 1950. Arte do jogo (GPL-3.0). -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="0.6" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#34405a"/>
    </linearGradient>
    <radialGradient id="lua" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6eed6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6eed6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="papelDeParede" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#3c3327"/>
      <rect x="0" width="2" height="46" fill="#463b2d"/>
      <path d="M23 9 q5 6 0 12 q-5 -6 0 -12 Z M23 25 q4 5 0 10 q-4 -5 0 -10 Z" fill="#4a3f30"/>
      <circle cx="0" cy="0" r="2.2" fill="#4a3f30"/>
      <circle cx="46" cy="46" r="2.2" fill="#4a3f30"/>
    </pattern>
    <linearGradient id="tacos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2717"/>
      <stop offset="1" stop-color="#5a3c22"/>
    </linearGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5434"/>
      <stop offset="1" stop-color="#5b3c22"/>
    </linearGradient>
    <linearGradient id="madeiraTampo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6640"/>
      <stop offset="1" stop-color="#6e4b2c"/>
    </linearGradient>
    <linearGradient id="cortina" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d1d1a"/>
      <stop offset="0.25" stop-color="#7a2e27"/>
      <stop offset="0.45" stop-color="#5a221e"/>
      <stop offset="0.7" stop-color="#83332b"/>
      <stop offset="1" stop-color="#4a1c19"/>
    </linearGradient>
    <linearGradient id="cupula" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41633f"/>
      <stop offset="1" stop-color="#26402a"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffe2a0" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="luzDaLuminaria" cx="1080" cy="420" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffb860" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffb860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <linearGradient id="tapete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c1f1b"/>
      <stop offset="0.5" stop-color="#7c2b24"/>
      <stop offset="1" stop-color="#5c1f1b"/>
    </linearGradient>
    <filter id="borrao" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="borraoLeve"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="ruido"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.09 0"/>
    </filter>
  </defs>

