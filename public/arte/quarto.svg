    <rect x="214" y="336" width="98" height="64" rx="7" fill="#4b2f1b" stroke="#2b1a0e" stroke-width="2"/>
    <rect x="222" y="344" width="50" height="40" rx="4" fill="#b59b70"/>
    <path d="M226 350 h42 M226 356 h42 M226 362 h42 M226 368 h42 M226 374 h42" stroke="#8b754f" stroke-width="2"/>
    <rect x="278" y="346" width="28" height="14" rx="2" fill="#e8d7a8"/>
