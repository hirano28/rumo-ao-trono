        <path d="M636.5 452 L650 452 L650.5 456 L636.5 456 Z"/><path d="M664 452 L677.5 452 L679 456 L665 456 Z"/>
        <path d="M593 456 L607.5 456 L607 460 L592 460 Z"/><path d="M621.5 456 L636.5 456 L636.5 460 L621.5 460 Z"/>
        <path d="M650.5 456 L665 456 L666 460 L651 460 Z"/><path d="M679 456 L694 456 L696 460 L680.5 460 Z"/>
      </g>
    </g>
