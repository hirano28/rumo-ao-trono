  </g>

  <!-- cone de luz da luminária -->
  <path d="M1052 384 L1110 384 L1190 474 L700 474 Z" fill="url(#cone)" filter="url(#borrao)"/>
  <ellipse cx="960" cy="470" rx="250" ry="12" fill="#ffe2a0" opacity="0.22" filter="url(#borrao)"/>

  <!-- luminária de banqueiro -->
  <g>
    <ellipse cx="1100" cy="464" rx="38" ry="7" fill="#1f2d1f"/>
    <rect x="1066" y="452" width="68" height="12" rx="4" fill="#2d3a2a"/>
    <path d="M1100 452 L1094 412 L1080 394" stroke="#a88545" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M1040 394 C1046 366 1114 366 1120 394 Z" fill="url(#cupula)"/>
    <ellipse cx="1080" cy="394" rx="40" ry="6" fill="#fff1c4"/>
    <circle cx="1080" cy="368" r="4" fill="#c9a35a"/>
