    <path d="M60 300 q30 30 0 90 M80 300 q24 40 0 90 M70 420 q26 40 0 100" stroke="#5f402a" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="166" cy="420" r="7" fill="#c9a35a"/>
