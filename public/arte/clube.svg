<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- O salão do torneio de adultos, Riga, outono de 1952, fim de tarde. Arte do jogo (GPL-3.0). -->
  <defs>
    <linearGradient id="paredeAlta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc4a8"/>
      <stop offset="1" stop-color="#bdb092"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5244"/>
      <stop offset="1" stop-color="#2f3f34"/>
    </linearGradient>
    <linearGradient id="anoitecer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a6b"/>
      <stop offset="0.6" stop-color="#8a6f7a"/>
      <stop offset="1" stop-color="#d79a6a"/>
    </linearGradient>
    <linearGradient id="tabuas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f3520"/>
      <stop offset="1" stop-color="#6b4a2c"/>
    </linearGradient>
    <linearGradient id="cortina" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e2420"/>
      <stop offset="0.5" stop-color="#7a312a"/>
      <stop offset="1" stop-color="#4f1d1a"/>
    </linearGradient>
    <radialGradient id="poca" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="borrao"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.09 0"/>
    </filter>

    <!-- luminária de metal pendurada -->
    <g id="luminaria">
      <line x1="0" y1="0" x2="0" y2="96" stroke="#2b2118" stroke-width="2"/>
      <path d="M-30 128 L-10 96 L10 96 L30 128 Z" fill="#3e4a3e" stroke="#1f1a14" stroke-width="1.5"/>
      <ellipse cx="0" cy="128" rx="30" ry="5" fill="#fff1c4"/>
      <path d="M-30 128 L-150 380 L150 380 L30 128 Z" fill="url(#cone)" filter="url(#borrao)"/>
    </g>

    <!-- mesa quadrada de torneio, com tabuleiro, relógio, cinzeiro e duas cadeiras -->
    <g id="mesaDeTorneio">
      <path d="M-18 -64 h36 v40 h-6 v-34 h-24 v34 h-6 Z" fill="#4a321f" stroke="#2b1a0e" stroke-width="1.2"/>
      <rect x="-70" y="-22" width="140" height="14" fill="#5a3b22" stroke="#2b1a0e" stroke-width="1.5"/>
      <rect x="-64" y="-8" width="10" height="46" fill="#3d2716"/><rect x="54" y="-8" width="10" height="46" fill="#3d2716"/>
      <path d="M-34 -22 L34 -22 L28 -34 L-28 -34 Z" fill="#e8d3a8" stroke="#2b1a0e" stroke-width="1"/>
      <g fill="#a87a4f"><path d="M-26 -34 h8 l-1 4 h-8 Z M-9 -34 h8 v4 h-9 Z M8 -34 h8 l1 4 h-8 Z M-18 -30 h9 l-1 4 h-9 Z M0 -30 h8 l1 4 h-9 Z M17 -30 h8 l2 4 h-9 Z"/></g>
      <g fill="#2b2118"><rect x="-20" y="-44" width="3" height="10"/><rect x="-4" y="-42" width="3" height="8"/><rect x="12" y="-45" width="3" height="11"/></g>
      <g fill="#f4ecd8"><rect x="-14" y="-40" width="3" height="6"/><rect x="20" y="-42" width="3" height="8"/></g>
      <rect x="40" y="-38" width="28" height="16" rx="3" fill="#6e4b2c" stroke="#2b1a0e" stroke-width="1"/>
      <circle cx="48" cy="-30" r="5" fill="#f4ecd8" stroke="#2b1a0e" stroke-width="0.8"/><circle cx="60" cy="-30" r="5" fill="#f4ecd8" stroke="#2b1a0e" stroke-width="0.8"/>
      <ellipse cx="-56" cy="-24" rx="9" ry="3" fill="#8f8a80" stroke="#2b1a0e" stroke-width="0.8"/>
    </g>

    <!-- jogador sentado, de costas, debruçado sobre o tabuleiro (silhueta) -->
    <g id="jogadorSentado">
      <path d="M-20 0 C-24 -30 -16 -52 0 -54 C16 -52 24 -30 20 0 Z" fill="#2c2a2a"/>
      <ellipse cx="0" cy="-62" rx="11" ry="12" fill="#3a3530"/>
      <path d="M-20 -6 L-34 10 M20 -6 L34 10" stroke="#2c2a2a" stroke-width="8" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- parede: caiada em cima, barra pintada de verde embaixo, como nos prédios públicos -->
  <rect width="1280" height="480" fill="url(#paredeAlta)"/>
  <rect y="300" width="1280" height="180" fill="url(#barra)"/>
  <rect y="296" width="1280" height="6" fill="#7a6a4e"/>
  <path d="M0 22 H1280" stroke="#a89b80" stroke-width="5"/>
  <rect width="1280" height="20" fill="#b3a68a"/>

  <!-- janelas altas, o céu de fim de tarde de outubro -->
  <g>
    <rect x="70" y="70" width="150" height="230" fill="url(#anoitecer)"/>
    <path d="M70 70 h150 v230 h-150 Z M145 70 v230 M70 150 h150 M70 225 h150" fill="none" stroke="#e6dcc4" stroke-width="7"/>
    <path d="M74 296 V262 h22 v-10 h18 v14 h14 v-34 l5 -4 l5 4 v34 h12 v-18 h26 v20 h18 v32 Z M136 228 l3 -26 l3 26 Z" fill="#2f2a3a" opacity="0.6"/>
    <rect x="58" y="296" width="174" height="10" fill="#c2b69b"/>
    <path d="M40 50 C60 160 52 260 66 312 L36 312 C26 220 30 120 24 50 Z" fill="url(#cortina)"/>
    <path d="M250 50 C230 160 238 260 224 312 L254 312 C264 220 260 120 266 50 Z" fill="url(#cortina)"/>
  </g>
  <g>
    <rect x="330" y="70" width="150" height="230" fill="url(#anoitecer)"/>
    <path d="M330 70 h150 v230 h-150 Z M405 70 v230 M330 150 h150 M330 225 h150" fill="none" stroke="#e6dcc4" stroke-width="7"/>
    <path d="M334 296 V258 h26 v12 h20 v-22 h16 v-12 l4 -30 l4 30 v12 h10 v26 h24 v-8 h18 v44 Z" fill="#2f2a3a" opacity="0.6"/>
    <rect x="318" y="296" width="174" height="10" fill="#c2b69b"/>
    <path d="M300 50 C320 160 312 260 326 312 L296 312 C286 220 290 120 284 50 Z" fill="url(#cortina)"/>
    <path d="M510 50 C490 160 498 260 484 312 L514 312 C524 220 520 120 526 50 Z" fill="url(#cortina)"/>
  </g>
  <rect x="20" y="40" width="250" height="12" rx="4" fill="#4a321f"/>
  <rect x="280" y="40" width="250" height="12" rx="4" fill="#4a321f"/>

  <!-- relógio de parede redondo -->
  <g>
    <circle cx="822" cy="96" r="34" fill="#efe4cc" stroke="#3a2516" stroke-width="6"/>
    <g stroke="#2b2118" stroke-width="2">
      <path d="M822 66 v6 M822 120 v6 M792 96 h6 M846 96 h6"/>
      <path d="M822 96 L822 76 M822 96 L838 104" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="822" cy="96" r="3" fill="#2b2118"/>
  </g>

  <!-- quadro do torneio, grande, com as rodadas -->
  <g>
    <rect x="560" y="80" width="200" height="200" fill="#3a2516"/>
    <rect x="570" y="90" width="180" height="180" fill="#efe4cc"/>
    <rect x="570" y="90" width="180" height="20" fill="#8e3b2e"/>
    <text x="660" y="104" font-family="Georgia, serif" font-size="10" fill="#efe4cc" text-anchor="middle" letter-spacing="1">ТУРНИРНАЯ ТАБЛИЦА</text>
    <g stroke="#2b2118" stroke-width="1" opacity="0.55">
      <path d="M578 130 H742 M578 150 H742 M578 170 H742 M578 190 H742 M578 210 H742 M578 230 H742 M578 250 H742"/>
      <path d="M620 116 V258 M644 116 V258 M668 116 V258 M692 116 V258 M716 116 V258"/>
    </g>
    <g fill="#2b2118" opacity="0.5">
      <rect x="582" y="135" width="30" height="3"/><rect x="582" y="155" width="26" height="3"/><rect x="582" y="175" width="32" height="3"/>
      <rect x="582" y="195" width="24" height="3"/><rect x="582" y="215" width="30" height="3"/><rect x="582" y="235" width="28" height="3"/>
      <rect x="648" y="135" width="14" height="3"/><rect x="672" y="155" width="14" height="3"/><rect x="624" y="175" width="14" height="3"/>
    </g>
    <circle cx="660" cy="84" r="3" fill="#c9a35a"/>
  </g>
  <!-- aviso datilografado ao lado do quadro -->
  <g>
    <rect x="780" y="168" width="70" height="92" fill="#f2ead8" transform="rotate(3 815 214)"/>
    <g stroke="#2b2118" stroke-width="1.2" opacity="0.5" transform="rotate(3 815 214)">
      <path d="M788 184 h54 M788 194 h48 M788 204 h52 M788 214 h40 M788 224 h50 M788 234 h44"/>
    </g>
    <circle cx="815" cy="172" r="2.5" fill="#8e3b2e"/>
  </g>

  <!-- cabide de pé, com sobretudos e chapéus -->
  <g>
    <rect x="1186" y="120" width="8" height="350" fill="#3a2516"/>
    <path d="M1170 470 h40 l-6 10 h-28 Z" fill="#3a2516"/>
    <path d="M1166 128 h48" stroke="#3a2516" stroke-width="6" stroke-linecap="round"/>
    <path d="M1160 134 C1150 220 1156 300 1166 360 L1196 360 C1196 280 1190 200 1180 134 Z" fill="#3b3a40"/>
    <path d="M1190 134 C1204 210 1212 290 1206 340 L1228 340 C1232 260 1220 190 1212 134 Z" fill="#5a4a3a"/>
    <ellipse cx="1170" cy="120" rx="20" ry="6" fill="#2f2b28"/><path d="M1158 120 q12 -18 24 0 Z" fill="#2f2b28"/>
    <ellipse cx="1212" cy="116" rx="18" ry="5" fill="#4a4038"/><path d="M1201 116 q11 -16 22 0 Z" fill="#4a4038"/>
  </g>

  <!-- assoalho de tábuas gastas -->
  <rect y="470" width="1280" height="250" fill="url(#tabuas)"/>
  <g stroke="#3a2516" stroke-width="2" opacity="0.6">
    <path d="M0 500 H1280 M0 534 H1280 M0 572 H1280 M0 614 H1280 M0 660 H1280 M0 708 H1280"/>
    <path d="M140 470 v30 M520 470 v30 M910 470 v30 M300 500 v34 M760 500 v34 M1120 500 v34 M60 534 v38 M640 534 v38 M1000 534 v38 M420 572 v42 M840 572 v42 M200 614 v46 M1180 614 v46 M560 660 v48"/>
  </g>
  <rect y="470" width="1280" height="16" fill="#000" opacity="0.18"/>

  <!-- luminárias e as poças de luz sobre as mesas -->
  <use href="#luminaria" x="360" y="0"/>
  <use href="#luminaria" x="930" y="0"/>
  <ellipse cx="360" cy="500" rx="210" ry="42" fill="url(#poca)"/>
  <ellipse cx="800" cy="500" rx="200" ry="40" fill="url(#poca)" opacity="0.7"/>

  <!-- mesas do torneio, ao fundo; duas partidas ainda em andamento -->
  <use href="#jogadorSentado" x="195" y="472"/>
  <use href="#mesaDeTorneio" x="250" y="500"/>
  <use href="#mesaDeTorneio" x="470" y="500"/>
  <use href="#mesaDeTorneio" x="690" y="500"/>
  <use href="#jogadorSentado" x="860" y="472"/>
  <use href="#mesaDeTorneio" x="910" y="500"/>

  <!-- mesa do árbitro: abajur, papéis, os envelopes dos lances secretos -->
  <g>
    <rect x="1040" y="430" width="170" height="14" fill="#5a3b22" stroke="#2b1a0e" stroke-width="1.5"/>
    <rect x="1046" y="444" width="10" height="70" fill="#3d2716"/><rect x="1194" y="444" width="10" height="70" fill="#3d2716"/>
    <rect x="1050" y="444" width="150" height="40" fill="#4a321f"/>
    <path d="M1060 430 L1068 404 L1092 404 L1100 430 Z" fill="#3e4a3e" stroke="#1f1a14" stroke-width="1"/>
    <rect x="1078" y="404" width="4" height="10" fill="#2b2118"/>
    <ellipse cx="1080" cy="432" rx="30" ry="8" fill="#fff1c4" opacity="0.5"/>
    <g transform="rotate(-6 1150 424)">
      <rect x="1120" y="414" width="44" height="26" fill="#e3d4ae" stroke="#8a6a43" stroke-width="1"/>
      <path d="M1120 414 L1142 430 L1164 414" fill="none" stroke="#8a6a43" stroke-width="1"/>
      <circle cx="1142" cy="430" r="3.5" fill="#8e3b2e"/>
    </g>
    <rect x="1130" y="420" width="44" height="12" fill="#efe4cc" transform="rotate(8 1150 424)"/>
    <rect x="1168" y="410" width="28" height="22" rx="3" fill="#6e4b2c" stroke="#2b1a0e" stroke-width="1"/>
    <circle cx="1175" cy="421" r="4.5" fill="#f4ecd8"/><circle cx="1189" cy="421" r="4.5" fill="#f4ecd8"/>
  </g>

  <!-- uma cadeira solta na frente, com o jornal de alguém -->
  <g>
    <path d="M118 560 h52 v-70 h-8 v62 h-36 v-62 h-8 Z" fill="#4a321f" stroke="#2b1a0e" stroke-width="1.2"/>
    <rect x="112" y="552" width="64" height="10" fill="#5a3b22" stroke="#2b1a0e" stroke-width="1.2"/>
    <rect x="116" y="562" width="8" height="50" fill="#3d2716"/><rect x="164" y="562" width="8" height="50" fill="#3d2716"/>
    <g transform="rotate(-8 146 546)">
      <rect x="120" y="536" width="54" height="18" fill="#e9e0c8" stroke="#8a7a5e" stroke-width="1"/>
      <path d="M126 541 h40 M126 546 h34 M126 550 h38" stroke="#2b2118" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <rect width="1280" height="720" fill="url(#vinheta)"/>
  <rect width="1280" height="720" filter="url(#grao)" opacity="0.9"/>
</svg>
