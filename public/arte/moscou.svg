<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- O palco da final do campeonato da URSS, Moscou, inverno de 1957. Arte do jogo (GPL-3.0). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a24"/>
      <stop offset="1" stop-color="#3e1c18"/>
    </linearGradient>
    <linearGradient id="cortina" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f1a17"/>
      <stop offset="0.5" stop-color="#8a2e27"/>
      <stop offset="1" stop-color="#4f1a17"/>
    </linearGradient>
    <linearGradient id="palco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="1" stop-color="#5a3b22"/>
    </linearGradient>
    <linearGradient id="plateia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3626"/>
      <stop offset="1" stop-color="#2a1e16"/>
    </linearGradient>
    <linearGradient id="refletor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff1c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="borrao"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="31"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.09 0"/>
    </filter>

    <!-- tabuleiro mural de demonstração, numa moldura de madeira -->
    <g id="mural">
      <rect x="-58" y="-58" width="116" height="116" fill="#3a2516"/>
      <rect x="-50" y="-50" width="100" height="100" fill="#e8d3a8"/>
      <g fill="#a87a4f">
        <path d="M-37.5 -50h12.5v12.5h-12.5z M-12.5 -50h12.5v12.5h-12.5z M12.5 -50h12.5v12.5h-12.5z M37.5 -50h12.5v12.5h-12.5z"/>
        <path d="M-50 -37.5h12.5v12.5h-12.5z M-25 -37.5h12.5v12.5h-12.5z M0 -37.5h12.5v12.5h-12.5z M25 -37.5h12.5v12.5h-12.5z"/>
        <path d="M-37.5 -25h12.5v12.5h-12.5z M-12.5 -25h12.5v12.5h-12.5z M12.5 -25h12.5v12.5h-12.5z M37.5 -25h12.5v12.5h-12.5z"/>
        <path d="M-50 -12.5h12.5v12.5h-12.5z M-25 -12.5h12.5v12.5h-12.5z M0 -12.5h12.5v12.5h-12.5z M25 -12.5h12.5v12.5h-12.5z"/>
        <path d="M-37.5 0h12.5v12.5h-12.5z M-12.5 0h12.5v12.5h-12.5z M12.5 0h12.5v12.5h-12.5z M37.5 0h12.5v12.5h-12.5z"/>
        <path d="M-50 12.5h12.5v12.5h-12.5z M-25 12.5h12.5v12.5h-12.5z M0 12.5h12.5v12.5h-12.5z M25 12.5h12.5v12.5h-12.5z"/>
        <path d="M-37.5 25h12.5v12.5h-12.5z M-12.5 25h12.5v12.5h-12.5z M12.5 25h12.5v12.5h-12.5z M37.5 25h12.5v12.5h-12.5z"/>
        <path d="M-50 37.5h12.5v12.5h-12.5z M-25 37.5h12.5v12.5h-12.5z M0 37.5h12.5v12.5h-12.5z M25 37.5h12.5v12.5h-12.5z"/>
      </g>
      <g stroke="#2b2118" stroke-width="1">
        <circle cx="-31" cy="-44" r="4.5" fill="#2b2118"/><circle cx="6" cy="-31" r="4.5" fill="#2b2118"/><circle cx="31" cy="-19" r="4.5" fill="#2b2118"/>
        <circle cx="-19" cy="6" r="4.5" fill="#f4ecd8"/><circle cx="19" cy="19" r="4.5" fill="#f4ecd8"/><circle cx="-44" cy="31" r="4.5" fill="#f4ecd8"/>
      </g>
      <rect x="-58" y="62" width="116" height="14" fill="#efe4cc"/>
      <path d="M-46 69h40 M4 69h40" stroke="#2b2118" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- mesa do palco, com tabuleiro, relógio e dois jogadores (silhuetas) -->
    <g id="mesaDoPalco">
      <path d="M-62 -40 C-66 -66 -58 -84 -44 -86 C-30 -84 -22 -66 -26 -40 Z" fill="#241c1a"/>
      <ellipse cx="-44" cy="-94" rx="10" ry="11" fill="#2f2622"/>
      <path d="M62 -40 C66 -66 58 -84 44 -86 C30 -84 22 -66 26 -40 Z" fill="#241c1a"/>
      <ellipse cx="44" cy="-94" rx="10" ry="11" fill="#2f2622"/>
      <rect x="-56" y="-42" width="112" height="12" fill="#4a321f" stroke="#1a110a" stroke-width="1.2"/>
      <rect x="-50" y="-30" width="100" height="36" fill="#3a2516"/>
      <path d="M-22 -42 L22 -42 L18 -50 L-18 -50 Z" fill="#e8d3a8" stroke="#1a110a" stroke-width="0.8"/>
      <rect x="-8" y="-60" width="16" height="10" rx="2" fill="#6e4b2c" stroke="#1a110a" stroke-width="0.8"/>
      <rect x="-30" y="-66" width="24" height="7" fill="#efe4cc" stroke="#8a6a43" stroke-width="0.6"/>
    </g>
  </defs>

  <!-- fundo do palco: parede de veludo e as cortinas abertas -->
  <rect width="1280" height="470" fill="url(#fundo)"/>
  <path d="M0 0 H1280 V44 C1150 62 1030 40 900 58 C770 74 640 46 500 62 C360 76 220 46 0 62 Z" fill="url(#cortina)"/>
  <path d="M0 0 H130 C110 160 140 330 118 470 H0 Z" fill="url(#cortina)"/>
  <path d="M1280 0 H1150 C1170 160 1140 330 1162 470 H1280 Z" fill="url(#cortina)"/>
  <g stroke="#3a1210" stroke-width="3" opacity="0.6">
    <path d="M30 70 C24 200 36 330 26 470 M70 66 C62 200 76 330 66 470 M1210 70 C1216 200 1204 330 1214 470 M1250 66 C1258 200 1244 330 1254 470"/>
  </g>

  <!-- os tabuleiros murais das partidas da rodada -->
  <use href="#mural" x="290" y="170"/>
  <use href="#mural" x="500" y="170"/>
  <use href="#mural" x="780" y="170"/>
  <use href="#mural" x="990" y="170"/>

  <!-- faixa vermelha lisa entre os murais -->
  <rect x="580" y="96" width="120" height="150" fill="#8e3b2e"/>
  <rect x="588" y="104" width="104" height="134" fill="none" stroke="#c9a35a" stroke-width="2"/>
  <circle cx="640" cy="171" r="22" fill="none" stroke="#c9a35a" stroke-width="3"/>

  <!-- quadro do torneio, alto, na lateral esquerda do palco -->
  <g>
    <rect x="148" y="300" width="128" height="150" fill="#3a2516"/>
    <rect x="156" y="308" width="112" height="134" fill="#efe4cc"/>
    <rect x="156" y="308" width="112" height="14" fill="#8e3b2e"/>
    <g stroke="#2b2118" stroke-width="0.8" opacity="0.55">
      <path d="M162 334 H262 M162 346 H262 M162 358 H262 M162 370 H262 M162 382 H262 M162 394 H262 M162 406 H262 M162 418 H262 M162 430 H262"/>
      <path d="M196 326 V436 M212 326 V436 M228 326 V436 M244 326 V436"/>
    </g>
  </g>

  <!-- luz dos refletores sobre o palco -->
  <g filter="url(#borrao)">
    <path d="M330 0 L380 0 L470 470 L250 470 Z" fill="url(#refletor)"/>
    <path d="M900 0 L950 0 L1030 470 L810 470 Z" fill="url(#refletor)"/>
  </g>

  <!-- o palco e as mesas -->
  <rect y="440" width="1280" height="90" fill="url(#palco)"/>
  <rect y="436" width="1280" height="8" fill="#3a2516"/>
  <g stroke="#3a2516" stroke-width="2" opacity="0.5"><path d="M0 470 H1280 M0 500 H1280"/></g>
  <use href="#mesaDoPalco" x="330" y="480"/>
  <use href="#mesaDoPalco" x="560" y="480"/>
  <use href="#mesaDoPalco" x="790" y="480"/>
  <use href="#mesaDoPalco" x="1020" y="480"/>
  <rect y="528" width="1280" height="16" fill="#2b1a0e"/>

  <!-- diante do palco: o corredor da plateia, com o encosto da primeira fila -->
  <rect y="544" width="1280" height="176" fill="url(#plateia)"/>
  <g fill="#4a1e1a" stroke="#2a0e0c" stroke-width="1">
    <path d="M0 700 q20 -26 40 0 q20 -26 40 0 q20 -26 40 0 q20 -26 40 0 v20 h-160 z"/>
    <path d="M1120 700 q20 -26 40 0 q20 -26 40 0 q20 -26 40 0 q20 -26 40 0 v20 h-160 z"/>
  </g>
  <!-- cadeira solta no corredor, com o jornal de alguém -->
  <g>
    <path d="M118 600 h52 v-70 h-8 v62 h-36 v-62 h-8 Z" fill="#4a1e1a" stroke="#2a0e0c" stroke-width="1.2"/>
    <rect x="112" y="592" width="64" height="10" fill="#5a2622" stroke="#2a0e0c" stroke-width="1.2"/>
    <rect x="116" y="602" width="8" height="48" fill="#3a1412"/><rect x="164" y="602" width="8" height="48" fill="#3a1412"/>
    <g transform="rotate(-8 146 586)">
      <rect x="120" y="576" width="54" height="18" fill="#e9e0c8" stroke="#8a7a5e" stroke-width="1"/>
      <path d="M126 581 h40 M126 586 h34 M126 590 h38" stroke="#2b2118" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- lustres -->
  <g>
    <line x1="420" y1="0" x2="420" y2="40" stroke="#5a4430" stroke-width="2"/>
    <path d="M380 48 C390 64 450 64 460 48 Z" fill="#c9a35a" stroke="#7a5a2a" stroke-width="1.5"/>
    <g fill="#fff1c4"><circle cx="386" cy="44" r="4"/><circle cx="403" cy="41" r="4"/><circle cx="420" cy="40" r="4"/><circle cx="437" cy="41" r="4"/><circle cx="454" cy="44" r="4"/></g>
    <line x1="860" y1="0" x2="860" y2="40" stroke="#5a4430" stroke-width="2"/>
    <path d="M820 48 C830 64 890 64 900 48 Z" fill="#c9a35a" stroke="#7a5a2a" stroke-width="1.5"/>
    <g fill="#fff1c4"><circle cx="826" cy="44" r="4"/><circle cx="843" cy="41" r="4"/><circle cx="860" cy="40" r="4"/><circle cx="877" cy="41" r="4"/><circle cx="894" cy="44" r="4"/></g>
  </g>

  <rect width="1280" height="720" fill="url(#vinheta)"/>
  <rect width="1280" height="720" filter="url(#grao)" opacity="0.9"/>
</svg>
